services:
  - type: web
    name: concursabot
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: INVITE_CODES
        value: CONCURSA2026,MILITAR-VIP,RECEITA-PRO
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
